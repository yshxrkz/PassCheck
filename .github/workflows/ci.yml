name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff (lint + bandit security rules)
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy --strict
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: pytest
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=95

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t passcheck:ci .
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm passcheck:ci --version
          test "$(docker run --rm --entrypoint id passcheck:ci -u)" != "0"

          # Weak password: exit status 1.
          status=0
          printf 'letmein\n' | docker run --rm -i passcheck:ci --stdin || status=$?
          test "$status" -eq 1

          # Strong password: exit status 0 and valid JSON.
          printf 'xK9#mQ2$vL7pR4!w\n' | docker run --rm -i passcheck:ci --stdin --json \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["passes"]'
