</text><text class="terminal-984012955-r2" x="0" y="386" textLength="780.8" clip-path="url(#terminal-984012955-line-15)">&#160;&#160;-&#160;Make&#160;it&#160;longer:&#160;aim&#160;for&#160;at&#160;least&#160;12&#160;characters,&#160;ideally&#160;16+.</text><text class="terminal-984012955-r2" x="1171.2" y="386" textLength="12.2" clip-path="url(#terminal-984012955-line-15)">
